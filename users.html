<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários - Master</title>
    <style>
        :root { 
            --primary: #1e293b; --accent: #6366f1; --bg: #0f172a; 
            --white: #f8fafc; --border: #334155; --card-bg: #1e293b;
            --danger: #ef4444; --success: #16a34a; --warning: #f59e0b;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--white); overflow: hidden; }
        
        .sidebar { width: 280px; background: #1e293b; padding: 20px; border-right: 1px solid var(--border); }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }

        .btn { border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; padding: 10px 20px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--warning); padding: 5px 10px; font-size: 0.8rem; color: #1e293b; }
        .btn-delete { background: var(--danger); padding: 5px 10px; font-size: 0.8rem; }
        .btn-back { background: #475569; margin-bottom: 20px; }

        .input-group { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 30px; }
        label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input, select { width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 15px; }
        
        .user-card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-info h3 { margin: 0; font-size: 1.1rem; color: var(--white); }
        .user-info p { margin: 2px 0; font-size: 0.85rem; color: #94a3b8; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .badge-true { background: rgba(22, 163, 74, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-false { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        
        .actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="gestor.html" class="btn btn-back">← Voltar Painel</a>
        <h3 style="color:var(--accent)">Gestão de Usuários</h3>
        <p style="font-size: 0.8rem; color: #94a3b8;">Controle quem pode acessar o sistema e quais os seus dados.</p>
    </aside>

    <main class="main-content">
        <div class="input-group">
            <h2 id="form-title" style="margin-top:0; font-size: 1.3rem;">Adicionar Usuário</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>Nome Completo</label>
                    <input type="text" id="user-nome" placeholder="João da Silva">
                </div>
                <div>
                    <label>E-mail (Login)</label>
                    <input type="email" id="user-email" placeholder="email@exemplo.com">
                </div>
            </div>
            
            <label>Status de Acesso</label>
            <select id="user-status">
                <option value="true">ATIVO (Permitir Acesso)</option>
                <option value="false">INATIVO (Bloquear Acesso)</option>
            </select>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-add" id="btn-salvar" onclick="salvarUser()">Gravar Usuário</button>
                <button class="btn" id="btn-cancelar" style="background:#475569; display:none;" onclick="resetForm()">Cancelar</button>
            </div>
        </div>

        <div id="users-list">
            <p>Carregando usuários...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDPLJ4Ln3Ton-DxsJ0tEKeioWHnV01Plo0",
            authDomain: "politicalgame-30215.firebaseapp.com",
            projectId: "politicalgame-30215",
            storageBucket: "politicalgame-30215.firebasestorage.app",
            messagingSenderId: "736655823319",
            appId: "1:736655823319:web:60ebdc530e101784b9bb92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let editId = null;

        // --- CARREGAR LISTA ---
        async function carregarUsers() {
            const listDiv = document.getElementById('users-list');
            try {
                const snap = await getDocs(query(collection(db, "users"), orderBy("nome", "asc")));
                
                listDiv.innerHTML = `<h3 style="margin-bottom:15px">Usuários Registados (${snap.size})</h3>`;
                
                if (snap.empty) {
                    listDiv.innerHTML += "<p style='color:gray'>Nenhum usuário encontrado.</p>";
                    return;
                }

                snap.forEach(d => {
                    const user = d.data();
                    const statusBool = user.status === true || user.status === "true";
                    
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `
                        <div class="user-info">
                            <div style="display:flex; align-items:center; gap:10px">
                                <h3>${user.nome}</h3>
                                <span class="badge badge-${statusBool}">${statusBool ? 'Ativo' : 'Inativo'}</span>
                            </div>
                            <p>${user.email || 'Sem email cadastrado'}</p>
                        </div>
                        <div class="actions">
                            <button class="btn btn-edit" onclick="prepararEdicao('${d.id}', '${user.nome}', '${user.email}', ${statusBool})">Editar</button>
                            <button class="btn btn-delete" onclick="excluirUser('${d.id}')">Excluir</button>
                        </div>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (e) {
                listDiv.innerHTML = "<p style='color:red'>Erro ao carregar usuários. Verifique as permissões.</p>";
                console.error(e);
            }
        }

        // --- SALVAR (CREATE / UPDATE) ---
        window.salvarUser = async () => {
            const nome = document.getElementById('user-nome').value;
            const email = document.getElementById('user-email').value;
            const status = document.getElementById('user-status').value === "true"; // Converte string para booleano

            if (!nome.trim() || !email.trim()) {
                alert("Preencha o nome e o email.");
                return;
            }

            try {
                if (editId) {
                    // UPDATE
                    await updateDoc(doc(db, "users", editId), { 
                        nome: nome,
                        email: email,
                        status: status
                    });
                    alert("Usuário atualizado com sucesso!");
                } else {
                    // CREATE
                    await addDoc(collection(db, "users"), {
                        nome: nome,
                        email: email,
                        status: status,
                        createdAt: serverTimestamp()
                    });
                    alert("Usuário cadastrado com sucesso!");
                }
                resetForm();
                carregarUsers();
            } catch (e) {
                console.error(e);
                alert("Erro ao processar: " + e.message);
            }
        };

        // --- PREPARAR EDIÇÃO ---
        window.prepararEdicao = (id, nome, email, status) => {
            editId = id;
            document.getElementById('user-nome').value = nome;
            document.getElementById('user-email').value = email === 'undefined' ? '' : email;
            document.getElementById('user-status').value = status.toString();
            
            document.getElementById('form-title').innerText = "Editar Usuário";
            document.getElementById('btn-salvar').innerText = "Atualizar Dados";
            document.getElementById('btn-cancelar').style.display = "inline-flex";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- RESETAR FORMULÁRIO ---
        window.resetForm = () => {
            editId = null;
            document.getElementById('user-nome').value = "";
            document.getElementById('user-email').value = "";
            document.getElementById('user-status').value = "true";
            document.getElementById('form-title').innerText = "Adicionar Usuário";
            document.getElementById('btn-salvar').innerText = "Gravar Usuário";
            document.getElementById('btn-cancelar').style.display = "none";
        };

        // --- EXCLUIR ---
        window.excluirUser = async (id) => {
            if (confirm("Tem certeza que deseja excluir este usuário? Esta ação não pode ser desfeita.")) {
                await deleteDoc(doc(db, "users", id));
                carregarUsers();
            }
        };

        // Inicialização
        carregarUsers();

    </script>
</body>
</html>
